name: Fabriquer l'appli Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'catalog.json'
      - 'README.md'
      - 'icons/**'
      - 'meta/**'
      - 'tool/fetch_icons.py'
      - '.github/workflows/icons.yml'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier Android
        run: |
          flutter create --org com.woustore --project-name woustore --platforms=android .
          rm -rf test
          cp catalog.json assets/catalog.json
          python3 tool/patch_android.py

      - name: Clé de signature fixe (mêmes clés pour toutes les versions)
        env:
          WOUSTORE_KEY_PASSWORD: ${{ secrets.WOUSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$WOUSTORE_KEY_PASSWORD" ]; then
            echo "::error::Le secret WOUSTORE_KEY_PASSWORD manque : ajoute-le dans Settings › Secrets and variables › Actions."
            exit 1
          fi
          mkdir -p ~/.android
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/woustore-key.enc -out ~/.android/debug.keystore \
            -pass env:WOUSTORE_KEY_PASSWORD
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA-256"

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: "Fabriquer l'APK léger, un fichier par type de téléphone"
        run: |
          # Numéro de version qui augmente à chaque fabrication : WouStore sait ainsi qu'il y a du nouveau.
          V="--build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}"
          # Téléphones récents (64 bits) : presque tous les Android depuis 2017.
          flutter build apk --release --target-platform android-arm64 $V
          cp build/app/outputs/flutter-apk/app-release.apk WouStore.apk
          # Anciens téléphones (32 bits).
          flutter build apk --release --target-platform android-arm $V
          cp build/app/outputs/flutter-apk/app-release.apk WouStore-32bit.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WouStore-apk
          path: WouStore*.apk

      - name: Publier en téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WouStore (essai ${{ github.run_number }})
          body: |
            WouStore.apk : téléphones récents (64 bits), presque tous les Android depuis 2017.
            WouStore-32bit.apk : anciens téléphones (32 bits).
          files: |
            WouStore.apk
            WouStore-32bit.apk

      - name: Mettre à jour les infos du catalogue (version de WouStore)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run icons.yml --repo ${{ github.repository }} --ref main
